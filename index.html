<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d11"><meta name="mobile-web-app-capable" content="yes"><title>Salsa/Bachata DJ</title><style>:root{color-scheme:dark;--bg:#0b0d11;--card:#161920;--line:#292e38;--text:#f5f6f8;--muted:#9da5b1;--accent:#8067ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 60px}.hero{padding:8px 3px 18px}h1{font-size:29px;margin:0 0 5px}.sub,.small,.status{color:var(--muted)}.small,.status{font-size:12px;line-height:1.45}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}h2{font-size:19px;margin:0 0 10px}input,select,button{font:inherit}input,select{width:100%;background:#0d1015;color:var(--text);border:1px solid #353b46;border-radius:11px;padding:12px}button{border:0;border-radius:11px;padding:12px 14px;font-weight:750}.primary{background:var(--accent);color:#fff;width:100%;font-size:16px}.secondary{background:#272c35;color:#fff}.danger{background:#351d24;color:#ffbac3}.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;color:#d6dbe2;font-size:13px;margin:10px 0 6px}.check{display:flex;gap:8px;align-items:center;background:#101319;border:1px solid var(--line);border-radius:10px;padding:10px}.check input{width:auto}.track{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.track:last-child{border-bottom:0}.num{color:var(--muted);text-align:right}.title{font-weight:650}.artist{font-size:13px;color:var(--muted);margin-top:2px}.meta{font-size:11px;color:#c7bfff;margin-top:4px}.hidden{display:none}.success{color:#38d996}.error{color:#ff6478}.range{width:100%;accent-color:var(--accent)}</style></head><body><main><section class="hero"><h1>💃 Salsa / Bachata DJ</h1><p class="sub">Your floor. Your rules. Randomized intelligently.</p></section><section class="card"><h2>Spotify</h2><label>Client ID</label><input id="client" placeholder="Paste Spotify Client ID"><label>Redirect URI</label><input id="redirect"><p class="small">Use the exact HTTPS URL where this app is hosted. PKCE means no client secret is stored here.</p><button class="primary" id="login">Connect Spotify</button><p id="auth" class="status">Not connected</p></section><section class="card"><h2>Add songs</h2><div class="row"><input id="q" placeholder="Song or artist"><button class="secondary" id="search">Search</button></div><div id="results"></div></section><section class="card"><h2>Generate</h2><div class="row"><div><label>Length</label><select id="mins"><option>30</option><option selected>60</option><option>90</option><option>120</option><option>180</option><option>240</option></select></div><div><label>Artist spacing</label><select id="acd"><option>3</option><option selected>4</option><option>5</option><option>6</option><option>8</option></select></div></div><label class="check"><input id="curve" type="checkbox" checked> Energy progression</label><label class="check"><input id="smooth" type="checkbox" checked> BPM smoothing</label><label>Peak intensity <span id="pv">4.2</span>/5</label><input id="peak" class="range" type="range" min="3" max="5" step=".1" value="4.2"><button class="primary" id="gen">Generate set</button></section><section class="card hidden" id="setcard"><h2>Generated set</h2><div id="set"></div><div class="row"><button class="secondary" id="regen">Regenerate</button><button class="primary" id="publish">Create Spotify playlist</button></div><p id="pub" class="status"></p></section><section class="card"><h2>Song pool <span id="count">0</span></h2><p class="small">Tap a song to edit category, energy, weight and BPM.</p><div id="pool"></div><button class="danger" id="clear">Clear local pool</button></section></main><script>
const API='https://api.spotify.com/v1',AUTH='https://accounts.spotify.com',SCOPES='playlist-modify-private';const K='salsaDJ';let tracks=JSON.parse(localStorage.getItem(K)||'[]'),generated=[];const $=x=>document.getElementById(x),CATS=[['SALSA_FAST','🔥 Salsa Fast'],['SALSA_MEDIUM','💃 Salsa Medium'],['BACHATA_SLOW','🌙 Bachata Slow'],['BACHATA_MEDIUM','🕺 Bachata Medium']];$('client').value=localStorage.client||'';$('redirect').value=localStorage.redirect||location.href.split('?')[0];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage[K]=JSON.stringify(tracks);renderPool()}function rand(n){let a=new Uint8Array(n);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}async function hash(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}function b64(a){return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}async function login(){let client=$('client').value.trim(),redirect=$('redirect').value.trim();if(!client||!redirect)return alert('Enter Client ID and Redirect URI.');localStorage.client=client;localStorage.redirect=redirect;let v=rand(64),c=b64(await hash(v)),st=rand(24);localStorage.verifier=v;localStorage.oauthState=st;let u=new URL(AUTH+'/authorize');u.search=new URLSearchParams({client_id:client,response_type:'code',redirect_uri:redirect,scope:SCOPES,code_challenge_method:'S256',code_challenge:c,state:st});location.href=u}async function callback(){let p=new URLSearchParams(location.search),code=p.get('code');if(!code)return;if(p.get('state')!==localStorage.oauthState)throw Error('OAuth state mismatch');let body=new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:localStorage.redirect,client_id:localStorage.client,code_verifier:localStorage.verifier});let r=await fetch(AUTH+'/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw Error('Spotify token exchange failed');let j=await r.json();localStorage.token=j.access_token;history.replaceState({},'',location.pathname)}async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+localStorage.token,'Content-Type':'application/json'}});if(r.status===401){localStorage.removeItem('token');throw Error('Spotify session expired; reconnect.')}if(!r.ok)throw Error((await r.text()).slice(0,250));return r.status===204?null:r.json()}async function search(){if(!localStorage.token)return alert('Connect Spotify first.');let q=$('q').value.trim();if(!q)return;$('results').innerHTML='<p class=status>Searching…</p>';try{let j=await api('/search?'+new URLSearchParams({q,type:'track',limit:10}));$('results').innerHTML=j.tracks.items.map(t=>`<div class=track><div class=num>♪</div><div><div class=title>${esc(t.name)}</div><div class=artist>${esc(t.artists.map(a=>a.name).join(', '))}</div></div><button class=secondary onclick='add(${JSON.stringify(t).replace(/'/g,'&#39;')})'>Add</button></div>`).join('')}catch(e){$('results').innerHTML='<p class=error>'+esc(e.message)+'</p>'}}window.add=t=>{if(tracks.some(x=>x.id===t.id))return alert('Already added.');let c=prompt('1 Salsa Fast\n2 Salsa Medium\n3 Bachata Slow\n4 Bachata Medium','1'),cat=CATS[Number(c)-1]?.[0];if(!cat)return;let e=Number(prompt('Energy 1–5','3'))||3,w=Number(prompt('Weight 1=normal, 2=frequent, .5=rare','1'))||1,b=prompt('BPM optional','');tracks.push({id:t.id,uri:t.uri,title:t.name,artist:t.artists.map(a=>a.name).join(', '),category:cat,energy:Math.max(1,Math.min(5,e)),weight:Math.max(.1,w),bpm:b?Number(b):null,duration:t.duration_ms});save()};function target(p){if(!$('curve').checked)return 3.2;if(p<.2)return 2.4;if(p<.55)return 3.2;if(p<.8)return Number($('peak').value);return 3}function pick(pool,prev,tg){let s=pool.map(t=>{let e=Math.exp(-Math.abs(t.energy-tg)*1.15),b=($('smooth').checked&&prev?.bpm&&t.bpm)?Math.exp(-Math.abs(prev.bpm-t.bpm)/12):1;return[t,Math.max(.01,t.weight)*(.35*e+.2*b+.45*Math.random())]});let r=Math.random()*s.reduce((a,x)=>a+x[1],0);for(let x of s){r-=x[1];if(r<=0)return x[0]}return s.at(-1)[0]}function generate(){let total=Number($('mins').value)*60000,pattern=CATS.map(x=>x[0]),by={};tracks.forEach(t=>(by[t.category]??=[]).push(t));if(pattern.some(c=>!by[c]?.length))return alert('You need songs in all four categories.');let out=[],al=new Map(),sl=new Map(),acd=Number($('acd').value),i=0,elapsed=0;while(elapsed<total&&i<500){let cat=pattern[i%4],p=i/Math.max(1,Math.ceil(total/210000)-1),pool=by[cat].filter(t=>i-(sl.get(t.id)??-999)>30&&i-(al.get(t.artist.toLowerCase())??-999)>acd);if(!pool.length)pool=by[cat].filter(t=>i-(sl.get(t.id)??-999)>30);if(!pool.length)pool=by[cat];let t=pick(pool,out.at(-1),target(Math.min(1,p)));out.push(t);elapsed+=t.duration;al.set(t.artist.toLowerCase(),i);sl.set(t.id,i);i++}generated=out;renderSet();$('setcard').classList.remove('hidden');window.scrollTo({top:$('setcard').offsetTop-10,behavior:'smooth'})}function renderSet(){$('set').innerHTML=generated.map((t,i)=>`<div class=track><div class=num>${String(i+1).padStart(2,'0')}</div><div><div class=title>${esc(t.title)}</div><div class=artist>${esc(t.artist)}</div></div><div class=meta>${esc(t.category.replaceAll('_',' '))}</div></div>`).join('')}function renderPool(){$('count').textContent=tracks.length;$('pool').innerHTML=tracks.map((t,i)=>`<div class=track onclick="edit(${i})"><div class=num>${i+1}</div><div><div class=title>${esc(t.title)}</div><div class=artist>${esc(t.artist)}</div><div class=meta>${esc(t.category)} · E${t.energy} · W${t.weight}${t.bpm?' · '+t.bpm+' BPM':''}</div></div><div>›</div></div>`).join('')||'<p class=status>No songs yet.</p>'}window.edit=i=>{let t=tracks[i],c=prompt('1 Salsa Fast\n2 Salsa Medium\n3 Bachata Slow\n4 Bachata Medium',String(CATS.findIndex(x=>x[0]===t.category)+1));if(!c)return;t.category=CATS[Number(c)-1]?.[0]||t.category;t.energy=Number(prompt('Energy 1–5',t.energy))||t.energy;t.weight=Number(prompt('Weight',t.weight))||t.weight;let b=prompt('BPM optional',t.bpm??'');t.bpm=b?Number(b):null;save()};async function publish(){if(!localStorage.token)return alert('Connect Spotify first.');$('pub').textContent='Creating…';try{let p=await api('/me/playlists',{method:'POST',body:JSON.stringify({name:'Salsa + Bachata — '+new Date().toLocaleDateString('sv-SE'),public:false,collaborative:false,description:'Generated by Salsa/Bachata DJ'})});for(let i=0;i<generated.length;i+=100)await api('/playlists/'+p.id+'/items',{method:'POST',body:JSON.stringify({uris:generated.slice(i,i+100).map(t=>t.uri)})});$('pub').innerHTML='<span class=success>Created.</span> <a href="'+esc(p.external_urls.spotify)+'" target=_blank>Open in Spotify</a>'}catch(e){$('pub').innerHTML='<span class=error>'+esc(e.message)+'</span>'}}$('login').onclick=login;$('search').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};$('gen').onclick=generate;$('regen').onclick=generate;$('publish').onclick=publish;$('peak').oninput=()=>$('pv').textContent=$('peak').value;$('clear').onclick=()=>{if(confirm('Delete local song pool?')){tracks=[];save()}};renderPool();(async()=>{try{await callback();if(localStorage.token)$('auth').innerHTML='<span class=success>Spotify connected.</span>'}catch(e){$('auth').innerHTML='<span class=error>'+esc(e.message)+'</span>'}})();
</script></body></html>
